  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body data-theme="dark" dir="ltr">
  <div class="bg-aurora"></div>
  <div class="bg-stars"></div>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo"><img src="assets/al-wilayat-logo.jpeg?v=5" alt="Al-Wilayat logo" /></div>
        <div>
          <div class="name">Al-Wilayat</div>
          <div class="tag" data-i18n="app_tag">Powered by Aeba</div>
        </div>
      </div>
      <nav id="nav"><!-- nav items injected --></nav>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar glass">
        <div class="icon-btn menu-toggle" id="menuBtn">☰</div>
        <a class="topbar-logo" id="topbarLogo" onclick="go('home')" title="Home"><img src="assets/al-wilayat-logo.jpeg?v=5" alt="Al-Wilayat" /></a>
        <label class="search">
          <span class="search-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
          <input data-i18n-ph="search" placeholder="Search…" aria-label="search" />
          <button class="search-mark" id="searchBackBtn" type="button" aria-label="Clear search" title="Clear search">×</button>
        </label>
        <div class="lang-pick">
          <div class="icon-btn" id="langBtn"><span class="lang-globe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span><span id="langLabel">English</span></div>
          <div class="lang-menu" id="langMenu">
            <div class="glass lang-box">
              <div class="lang-box-title" data-i18n="choose_language">Choose language</div>
              <div class="lang-box-list">
                <button data-lang="en">English</button>
                <button data-lang="ar">العربية</button>
                <button data-lang="ur">اردو</button>
                <button data-lang="fa">فارسی</button>
                <button data-lang="az">Azərbaycanca</button>
                <button data-lang="ms">Bahasa Melayu</button>
              </div>
            </div>
          </div>
        </div>
        <!-- Logged-in account: round avatar with a drop-down (name + sign out) -->
        <div class="acct-pick" id="acctPick" hidden>
          <button class="acct-btn" id="acctBtn" type="button" aria-label="Account"><span id="acctAvatar">A</span></button>
          <div class="acct-menu" id="acctMenu">
            <div class="glass acct-card">
              <div class="acct-head">
                <div class="acct-av-lg" id="acctAvatarLg">A</div>
                <div class="acct-name-top" id="acctNameTop">—</div>
              </div>
              <button class="acct-signout" id="acctSignout" type="button" data-i18n="sign_out">Sign out</button>
            </div>
          </div>
        </div>
      </header>

      <div id="views"><!-- views injected --></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Phone bottom navigation (primary modules) -->
  <nav class="bottom-nav" id="bottomNav"><!-- injected --></nav>

  <!-- Dua of the Day sheet: slides up from the bottom -->
  <div class="dua-backdrop" id="duaBackdrop"></div>
  <aside class="dua-sheet" id="duaSheet" aria-label="Dua of the Day">
    <div class="dua-grab" aria-hidden="true"></div>
    <div class="dua-sheet-body" id="duaSheetBody"><!-- injected --></div>
  </aside>

  <!-- Q&A sheet: slides up from the bottom -->
  <div class="dua-backdrop" id="qaBackdrop"></div>
  <aside class="dua-sheet" id="qaSheet" aria-label="Q&A">
    <div class="dua-grab" aria-hidden="true"></div>
    <div class="dua-sheet-body" id="qaSheetBody"><!-- injected --></div>
  </aside>

  <!-- Reader sheet: a surah / juz / hadith book opens sliding up from the bottom -->
  <div class="dua-backdrop" id="qrBackdrop"></div>
  <aside class="dua-sheet qr-sheet" id="qrSheet" aria-label="Reader">
    <div class="dua-grab" aria-hidden="true"></div>
    <div class="dua-sheet-body" id="qrSheetBody"><!-- injected --></div>
  </aside>

  <script>window.WILAYAT_STATIC=true;</script>
  <script src="js/data.js?v=20260801-eshia164"></script>
  <script src="js/duas31.js?v=20260728-duaday1"></script>
  <script src="js/quiz.js?v=20260728-quiz1"></script>

  <script src="js/journey.js?v=20260730-journey4"></script>
  <script src="js/proofs.js?v=20260731-proofs5"></script>
  <script src="js/science.js?v=20260731-science7"></script>
  <script src="js/life.js?v=20260731-life11"></script>
  <script src="js/mahdi.js?v=20260803-mahdi4"></script>
  <script src="js/mahdi_tr.js?v=20260803-mahdi4"></script>
  <script src="js/app.js?v=20260801-eshia164"></script>
  <!-- Show the signed-in user (sidebar + settings sheet) + handle sign out. -->
  <script>
    (function () {
      var s; try { s = JSON.parse(localStorage.getItem("wilayat.auth") || "null"); } catch (e) { s = null; }
      if (s && s.user) {
        var name = (s.user.full_name || "").trim();
        var initial = (name || "?").charAt(0).toUpperCase();
        var display = name || s.user.email;
        var box = document.getElementById("account");
        if (box) { document.getElementById("accountName").textContent = display; document.getElementById("accountAvatar").textContent = initial; box.hidden = false; }
        var sBox = document.getElementById("settingsAccount");
        if (sBox) { document.getElementById("saName").textContent = display; document.getElementById("saAvatar").textContent = initial; sBox.hidden = false; }
        var aPick = document.getElementById("acctPick");
        if (aPick) {
          document.getElementById("acctAvatar").textContent = initial;
          document.getElementById("acctAvatarLg").textContent = initial;
          document.getElementById("acctNameTop").textContent = display;
          aPick.hidden = false;
        }
      }
      function signOut() { localStorage.removeItem("wilayat.auth"); location.replace("auth.html"); }
      var b1 = document.getElementById("signOutBtn"); if (b1) b1.addEventListener("click", signOut);
      var b2 = document.getElementById("saSignout"); if (b2) b2.addEventListener("click", signOut);
      var b3 = document.getElementById("acctSignout"); if (b3) b3.addEventListener("click", signOut);
    })();
  </script>
</body>
</html>
